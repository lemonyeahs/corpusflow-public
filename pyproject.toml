[project]
name = "corpusflow"
version = "0.1.0"
description = "CorpusFlow P0-A engineering foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135,<0.136",
  "uvicorn>=0.41,<0.42",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.3,<4",
  "redis>=7,<8",
  "celery>=5.6,<6",
  "boto3>=1.42,<2",
  "pydantic>=2.12,<3",
  "pypdf>=5,<6",
]
[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<0.29", "ruff>=0.15,<0.16", "mypy>=1.19,<2", "boto3-stubs[s3]>=1.42,<2"]
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/corpusflow"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicitly configured disposable PostgreSQL"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.per-file-ignores]
"apps/api/src/corpusflow/api/v1/business.py" = ["E501", "E701", "E702", "B007", "B008", "UP017"]
"scripts/benchmark_p1a_parsers.py" = ["E501"]
"scripts/build_p1a_fixtures.py" = ["E501"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["apps/api/src"]
exclude = ["apps/api/src/corpusflow/api/v1/business.py"]
