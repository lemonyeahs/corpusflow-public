name: P0-A checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          python-version: "3.12"
      - run: make verify-environment VERIFY_ARGS="--report-dir .local/ci-verification"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-verification
          path: .local/ci-verification
