function drawNav(){ $('nav').innerHTML=navGroups.map(g=>`<div class="nav-label">${g.name}</div>${g.items.map(([id,title,ico])=>`<button class="nav-btn ${state.page===id?'active':''}" data-nav="${id}"><span class="ico">${ico}</span>${title}</button>`).join('')}`).join('')}
function chartProgress(t,w,tone=''){return `<div class="preview-bars"><span>${t}</span><div class="progress"><span class="${tone==='good'?'ok':''}" style="width:${Math.min(100,Math.max(0,w))}%"></span></div><b>${w}%</b></div>`}
function flowView(){let arr=[['数据登记','来源 / 许可'],['解析与结构化','多格式分流'],['清洗质量门控','规则 / 复核'],['数据集构建','筛选 / 生成'],['发布与验证','评测 / 反馈']];return `<div class="flow-timeline">${arr.map((x,i)=>`<div class="step"><strong>0${i+1}</strong><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div>`}

<div class="hero"><div><div class="app-label" style="color:#a1e8df">CORPUSFLOW / DATA LIFECYCLE</div><h2>从原始文件，到可复现、可追溯、可交付的训练数据</h2><p>一条贯通来源管理、DAG 执行、质量门控、数据集构建、审核与下游效果验证的工作流。</p></div><span class="hero-chip">7 个工作页面 · 可交互演示</span></div>

<div class="dash-stack"><section class="card card-pad"><div class="card-h">最近任务 <small>可进入执行详情与日志</small></div><div class="table-wrap"><table class="tbl"><thead><tr><th>任务</th><th>流水线 / 来源</th><th>状态</th><th>进度</th><th>操作</th></tr></thead><tbody>${runs.slice(0,5).map(r=>`<tr><td class="mono">${r.id}</td><td><b>${esc(r.name)}</b><div class="subtext">${esc(r.pipeline)} · ${esc(r.source)}</div></td><td>${statusTag(r.status)}</td><td>${Math.min(100,Math.round(r.step/5*100))}%</td><td>${button('详情','run:'+r.id,'tiny')}</td></tr>`).join('')}</tbody></table></div></section>
<section class="card card-pad"><div class="card-h">最近发布的数据产品</div>${state.dataset.releases.slice(0,3).map(r=>`<div class="timeline-item"><span class="operator-icon" style="width:31px;height:31px">▣</span><div class="tiny-lines" style="flex:1"><strong>${esc(r.name)} ${tag(r.version,'blue')}</strong><p>${fmt(r.samples)} 条 · ${r.type} · ${r.created}</p></div>${button('查看','dataset:catalog','tiny')}</div>`).join('')}<div class="notice-inline" style="margin-top:11px">页面数字为原型示例，不与实际数据仓库同步。</div></section></div>`}
function licenseMark(d){return d.authorized?tag(d.license,'good'):tag(d.license,'bad')}
function assets(){const a=state.assets,filtered=docs.filter(d=>(a.category==='全部'||d.category===a.category)&&(a.batch==='全部'||d.batch===a.batch)&&(a.status==='全部'||(a.status==='待复核'?effectiveMax(d)===2:(a.status==='已审核'?d.quality==='reviewed':!d.authorized)))&&(`${d.id}${d.name}${d.origin}${d.domain}`.toLowerCase().includes(a.query.toLowerCase())));return `${head('原始数据资产','对原始文件、批次、领域、授权与解析状态统一登记管理。',button('+ 批量登记文件','modal:upload','primary'))}${note()}<div class="stat-row">${stat('演示源文件','12,480','真实列表仅显示演示记录')}${stat('已登记示例',docs.length,'本地可交互数据')}${stat('待复核示例',docs.filter(d=>effectiveMax(d)===2).length,'已阻止进入后续构建')}${stat('不可用于训练',docs.filter(d=>!d.authorized).length,'来源许可限制')}</div>

<select class="select" data-change="asset:batch">${['全部',...new Set(docs.map(d=>d.batch))].map(s=>`<option ${a.batch===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
<select class="select" data-change="asset:status">${['全部','已审核','待复核','授权受限'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select>
${button('重置筛选','asset:reset','tiny')}</div>
<div class="table-wrap"><table class="tbl"><thead><tr><th>来源 ID / 文件</th><th>类别 / 领域</th><th>来源 / 批次</th><th>授权范围</th><th>解析状态</th><th>操作</th></tr></thead><tbody>${filtered.map(d=>`<tr><td><b class="mono">${d.id}</b><div class="subtext">${esc(d.name)} · ${esc(d.size)}</div></td><td>${esc(d.category)}<div class="subtext">${esc(d.domain)}</div></td><td>${esc(d.origin)}<div class="subtext">${esc(d.batch)}</div></td><td>${licenseMark(d)}</td><td>${effectiveMax(d)===2?statusTag('pending'):tag(d.parse==='完成'?'已解析':d.parse,'blue')}</td><td>${button('查看血缘','trace:'+d.id,'tiny')}${button('详情','source:'+d.id,'tiny')}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty-state">没有匹配的来源记录</div></td></tr>'}</tbody></table></div><div class="foot-note">文件名和元数据示例均为模拟；本地新登记记录只保留页面内的文件信息，不上传或持久化文件内容。</div></section>
<div class="split-even"><div class="card card-pad"><div class="card-h">来源批次</div>${['BATCH-101','BATCH-102','BATCH-103'].map(b=>`<div class="timeline-item"><span class="operator-icon">▤</span><div class="tiny-lines"><strong>${b}</strong><p>${docs.filter(x=>x.batch===b).length} 份演示来源 · 关联许可与处理任务</p></div></div>`).join('')}</div>

function effectiveMax(d){return d.id==='SRC-0002'&&issues.find(i=>i.id==='ISSUE-001')?.status==='resolved'?4:d.max}
function operatorCard(id){const x=opDefs[id],active=state.pipeline.node===id;return `<div class="operator-row ${active?'active':''}"><span class="operator-icon">${id==='pdf'?'▤':id==='html'?'⌘':id==='read'?'▣':id==='builder'?'✦':'◇'}</span><div style="flex:1;min-width:0"><strong>${x.name}</strong><div class="subtext">${x.kind} · ${x.version}</div></div>${button('查看参数','op:'+id,'tiny')}</div>`}
function dagSvg(){const defs=[['read',25,130,'来源读取'],['pdf',175,57,'PDF / OCR'],['html',175,210,'HTML 正文'],['structure',338,130,'结构化抽取'],['dedup',493,130,'清洗去重'],['builder',650,130,'SFT 构建']];let paths='<path d="M155 154 L166 154 L166 81 L175 81"/><path d="M155 154 L166 154 L166 234 L175 234"/><path d="M305 81 L322 81 L322 154 L338 154"/><path d="M305 234 L322 234 L322 154 L338 154"/><path d="M468 154 L493 154"/><path d="M623 154 L650 154"/>';return `<svg viewBox="0 0 802 320" role="img" aria-label="PDF/HTML 分支的 DAG 任务编排图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8aaecb"/></marker></defs><g class="dag-edge">${paths}</g><text class="dag-label" x="171" y="47">PDF</text><text class="dag-label" x="171" y="280">HTML</text>${defs.map(([id,x,y,name])=>`<g class="dag-node ${state.pipeline.node===id?'active':''}" data-op="${id}"><rect class="node-box" x="${x}" y="${y}" rx="10" width="130" height="48"/><circle cx="${x+14}" cy="${y+24}" r="4" fill="${id==='dedup'?'#2cb39b':'#468fda'}"/><text class="node-title" x="${x+24}" y="${y+20}">${name}</text><text class="node-meta" x="${x+24}" y="${y+35}">${opDefs[id].kind} · ${id}</text></g>`).join('')}</svg>`}
function nodeDetail(){const id=state.pipeline.node,x=opDefs[id];const p=state.pipeline.params[id];return `<div class="card card-pad"><div class="flex-between"><h3 class="section-title" style="margin:0">${x.name}</h3>${tag(x.kind,'blue')}</div><div class="subtext" style="margin:7px 0 13px">${x.version}</div><div class="kv"><span>输入</span><b>${esc(x.in)}</b><span>输出</span><b>${esc(x.out)}</b></div><div class="section-title">算子参数（可编辑演示）</div><div class="param-list">${Object.entries(p).map(([k,v])=>`<div class="field"><label>${esc(k)}</label><input class="input full" data-param="${id}:${k}" value="${esc(v)}" /></div>`).join('')}</div>${button('保存流水线配置','pipeline:save','primary')}<div class="foot-note">保存修改的是演示模板配置与版本号，不会实际调用算子。</div></div>`}
function pipeline(){const p=state.pipeline;let tab=p.tab;let run=p.runs.find(r=>r.id===p.run)||p.runs[0];return `${head('处理流水线','算子库、DAG 条件路由、任务实例、节点日志与失败恢复。',button('新建模拟任务','pipeline:new','primary')+button('查看血缘','go:trace'))}${note()}${pageTabs([['dag','DAG 编排'],['operators','算子库'],['runs','运行实例与日志']],tab,'pipeline')}
${tab==='dag'?`<section class="card card-pad section-gap"><div class="card-h">论文与网页语料标准化流水线 <small>模板 ${esc(p.version)} · 点击图中节点</small></div><div class="dag-work"><div><div class="dag-canvas">${dagSvg()}</div><div class="dag-foot">${tag('PDF → PDF/OCR 解析','blue')}${tag('HTML → 正文提取','blue')}${tag('统一结构化','good')}${tag('质量门控','good')}</div><div class="toolrow" style="margin-top:15px">${button('校验 DAG','pipeline:validate')}${button('查看运行历史','pipeline:tab:runs')}${button('新建执行实例','pipeline:new','primary')}</div></div>${nodeDetail()}</div></section><div class="notice-inline">不同文件类型通过条件路由进入不同算子分支；上方模板表示依赖关系，不等于一次执行记录。每次运行保留独立 run_id、参数快照、日志和产物引用。</div>`:
 tab==='operators'?`<div class="split-layout"><section class="card card-pad"><div class="card-h">可复用算子库 <small>${opOrder.length} 个预置算子</small></div>${opOrder.map(operatorCard).join('')}</section>${nodeDetail()}</div>`:
 `<div class="split-layout"><section class="card card-pad"><div class="card-h">任务执行历史 <small>示例实例，可在浏览器内模拟状态推进</small></div><div class="table-wrap"><table class="tbl"><thead><tr><th>任务 ID</th><th>名称 / 来源</th><th>状态</th><th>操作</th></tr></thead><tbody>${p.runs.map(r=>`<tr class="${p.run===r.id?'selected':''}"><td class="mono">${r.id}</td><td>${esc(r.name)}<div class="subtext">${esc(r.source)}</div></td><td>${statusTag(r.status)}</td><td>${button('详情','run:'+r.id,'tiny')}</td></tr>`).join('')}</tbody></table></div></section><section class="card card-pad"><div class="card-h">执行详情 ${statusTag(run.status)}</div><div class="kv"><span>Run ID</span><b>${run.id}</b><span>模板版本</span><b>${run.pipeline}</b><span>来源</span><b>${run.source}</b><span>开始时间</span><b>${run.started}</b><span>已执行阶段</span><b>${run.step}/5</b><span>耗时</span><b>${run.duration}</b></div><div class="progress"><span class="${run.status==='completed'?'ok':''}" style="width:${run.step/5*100}%"></span></div><div class="section-title" style="margin:17px 0 7px">逐节点日志</div><div class="logbox">${esc(run.logs.join('\n'))}</div><div class="toolrow" style="margin:15px 0 0">${run.status==='failed'?button('失败重试并恢复','pipeline:retry','primary'):run.status==='running'||run.status==='queued'?button('推进一次模拟执行','pipeline:next','primary'):button('查看来源血缘','trace:'+run.source)}${button('查看质量问题','quality:issues')}</div></section></div>`}`}
function sourceMeta(){const d=docs[state.sourceIndex];return `<div class="card source-card section-gap"><div class="fileico">${d.type.includes('HTML')?'WEB':'PDF'}</div><div style="flex:1"><div class="docname">${esc(d.name)}</div><div class="docmeta">${d.id} · ${esc(d.domain)} · ${d.size} · ${d.pages} 页 · SHA256 ${esc(d.sha)}</div></div>${effectiveMax(d)<2?tag('未解析','warn'):effectiveMax(d)<4?statusTag('pending'):tag('已处理','good')}</div>`}
function trace(){const d=docs[state.sourceIndex],blocked=state.stage>effectiveMax(d);let variants=[d.before,d.md,d.json,d.clean,d.product],labels=['原始来源 / 元数据','解析后 Markdown','结构化 JSON','清洗 / 审核片段','下游训练产物'],from=state.stage===0?`原始文件定位：${d.id} / ${d.name}`:variants[state.stage-1],to=blocked?'该阶段未生成产物。前置阶段存在待复核问题，后续处理及训练发布已被质量门控阻断。':variants[state.stage];let delta=state.stage===1?'<del>Journal template / 页眉、页脚、排版噪声</del> → <ins>正文、标题、章节内容保留</ins>':state.stage===3?'<del>格式噪声、重复片段</del> → <ins>合格片段、质量标签、来源页码</ins>':'该阶段执行了标准化字段映射并保留来源引用。';return `${head('单样本全链路追踪','点击每个阶段核对输入输出、异常阻断、处理版本和产物血缘。',button('返回流水线','go:pipeline'))}${note()}
<div class="toolrow"><span style="font-weight:750;font-size:12px">当前来源</span><select class="select" data-change="trace:doc">${docs.map((v,i)=>`<option value="${i}" ${i===state.sourceIndex?'selected':''}>${esc(v.id+' · '+v.name)}</option>`).join('')}</select>${button('查看来源信息','source:'+d.id)}</div>${sourceMeta()}
<section class="card card-pad section-gap"><div class="card-h">真实血缘关系的原型表达 <small>点击阶段查看详细产物 · L0–L4 为处理阶段</small></div><div style="overflow-x:auto"><div class="lineage-track">${stages.map(([s,n],i)=>`${i?'<div class="lineage-arrow">→</div>':''}<button class="lineage-stage ${state.stage===i?'active':''} ${i>effectiveMax(d)?'blocked':''}" data-stage="${i}"><span class="num">${s}</span><strong>${n}</strong><small>${i>effectiveMax(d)?'阻断 / 无产物':i===effectiveMax(d)&&d.id==='SRC-0002'?'待复核':'已生成'}</small></button>`).join('')}</div></div>${effectiveMax(d)<4?`<div class="notice-inline warn" style="margin-top:13px">质量门控生效：${esc(d.id)} 在 ${stages[effectiveMax(d)][0]} 阶段停止，后续不能生成可发布样本。${button('处理 ISSUE-001','quality:issues','tiny')}</div>`:''}</section>
<div class="split-layout section-gap"><section class="card card-pad"><div class="flex-between" style="margin-bottom:14px"><h3 class="section-title" style="margin:0">${stages[state.stage][0]} · ${labels[state.stage]}</h3>${blocked?tag('无产物','bad'):tag('只读快照','blue')}</div><div class="comparison"><div><div class="small-title">节点输入 / 上游产物</div><div class="codebox light">${esc(from)}</div></div><div><div class="small-title">节点输出 / 当前产物</div><div class="codebox" id="trace-code">${esc(to)}</div></div></div><div class="summaryline"><b>变更摘要：</b> ${blocked?'未执行，不应展示伪造的下一阶段数据。':delta}</div><div class="toolrow" style="margin-top:13px;margin-bottom:0">${!blocked?button('复制输出片段','trace:copy'):''}${button('查看算子配置','go:pipeline')}${button('质量问题与复核','quality:issues')}</div></section>
<section class="card card-pad"><div class="card-h">溯源元数据</div><div class="kv"><span>Source ID</span><b>${d.id}</b><span>处理 Run</span><b>${d.id==='SRC-0002'?'RUN-1023-002':'RUN-1023-001'}</b><span>算子版本</span><b>${opDefs[["read","pdf","structure","dedup","builder"][state.stage]].version}</b><span>内容页码</span><b>${d.pages} 页 · 示例第 2 页</b><span>源哈希</span><b>${esc(d.sha)}</b><span>来源许可</span><b>${esc(d.license)}</b><span>质量状态</span>${effectiveMax(d)<4?tag('门控待复核','warn'):tag(d.quality==='reviewed'?'Reviewed':'需进一步审查','good')}</div><div class="notice-inline">产物关系需持久化记录 parent_id / child_id / run_id / operator_version / source_page，支持样本反向追溯。</div></section></div>

document.addEventListener('change',event=>{
 let el=event.target;
 if(el.dataset.param){let [id,k]=el.dataset.param.split(':');state.pipeline.params[id][k]=el.value;return}
 if(el.dataset.rule){let r=qualityRules.find(x=>x.id===el.dataset.rule);if(r){r.enabled=el.checked;notify(r.name+(r.enabled?' 已启用（演示）':' 已关闭（演示）'));render()}return}
 if(el.dataset.config){let k=el.dataset.config;if(k==='modal-domain')return;let c=state.dataset.config;if(k in c){c[k]=['target','train','dev','test'].includes(k)?Number(el.value):el.value;if(['domain','source','quality','type'].includes(k))render()}return}
 if(el.dataset.change){let [area,k]=el.dataset.change.split(':');if(area==='asset'){state.assets[k]=el.value;render()}if(area==='trace'){state.sourceIndex=Number(el.value);state.stage=0;render()}return}
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='asset-search'){const pos=el.selectionStart;state.assets.query=el.value;render();const e=$('asset-search');if(e){e.focus();e.setSelectionRange(pos,pos)}return}
 if(el.dataset.config&&el.tagName==='INPUT'&&el.type!=='number'){const k=el.dataset.config;if(k in state.dataset.config)state.dataset.config[k]=el.value;return}
 if(el.dataset.config&&el.type==='number'){state.dataset.config[el.dataset.config]=Number(el.value);return}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal){state.modal='';render()}});
$('content').insertAdjacentHTML('afterend','<div id="dynamic-modal"></div>');
// Prevent legacy static labels from being misread as actual metrics.
const hdr=document.querySelector('.topright .search-global');if(hdr)hdr.textContent='本地交互原型 · 可访问 7 个页面';
render();

</script>
</body>
</html>
