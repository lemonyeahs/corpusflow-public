<script>
/* Standalone visual prototype. All displayed records are deterministic preview fixtures.
   No backend calls, real execution history, authentication or production datasets are implied. */
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/>',book:'<path d="M12 5v16M3 4c4-1 7 0 9 2 2-2 5-3 9-2v15c-4-1-7 0-9 2-2-2-5-3-9-2Z"/>',chat:'<path d="M4 4h16v12H9l-5 4Z"/><path d="M8 8h8M8 12h5"/>',columns:'<rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/>',nodes:'<rect x="2" y="9" width="5" height="6" rx="1"/><rect x="17" y="2" width="5" height="6" rx="1"/><rect x="17" y="16" width="5" height="6" rx="1"/><path d="M7 12h5V5h5m-5 7v7h5"/>',sliders:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="18" r="2"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',bell:'<path d="M5 17h14l-2-4V8a5 5 0 0 0-10 0v5Zm5 3h4"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 16v5h16v-5"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',shield:'<path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6Z"/><path d="m8 12 3 3 5-6"/>',file:'<path d="M5 3h9l5 5v13H5Z"/><path d="M14 3v6h5M8 13h8M8 17h5"/>'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.file}</svg>`}
function decorate(){document.querySelectorAll('[data-icon]').forEach(el=>{const name=el.dataset.icon;el.insertAdjacentHTML('afterbegin',icon(name));el.removeAttribute('data-icon')})}
const formats=[['PDF',2480,'#cc8c83','#fbefec','研究文档与论文'],['HTML',1920,'#c89d60','#fbf4e7','网页与知识文章'],['MD',1360,'#7892b0','#eef2f9','知识库与技术文档'],['TXT',960,'#78a090','#eef7f2','纯文本语料'],['DOCX',640,'#7398c4','#edf3fb','书籍与办公文档'],['CSV',320,'#81a57b','#f0f6ed','结构化表格'],['JSON',200,'#a496bf','#f3eff8','结构化数据'],['JSONL',120,'#669e9a','#edf7f5','训练数据记录']];
const products={cpt:{name:'CPT',cn:'继续预训练',desc:'让模型读懂领域知识，建立专业认知。',count:2000,unit:'篇',tokens:'8.42M',color:'#338b73',tint:'#eaf5ee',icon:'book'},sft:{name:'SFT',cn:'指令微调',desc:'从优质问答中学习，提升指令遵循能力。',count:1500,unit:'条',tokens:'1.86M',color:'#6e91c6',tint:'#edf2fb',icon:'chat'},dpo:{name:'DPO',cn:'偏好对齐',desc:'比较回答的好与更好，让输出符合期待。',count:800,unit:'对',tokens:'1.24M',color:'#b19569',tint:'#f8f3e9',icon:'columns'}};
const sampleTopics=['领域知识与数据治理','数据清洗与隐私保护','训练集与评估策略'];
let datasetTab='overview',sampleIndex=0,selectedFormat='all',lastFocus=null,toastTimer;
const fmt=n=>n.toLocaleString('en-US');
function heading(title,desc,actions='',eyebrow='DATA WORKSPACE'){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function footer(){return `<footer class="footer"><span><i class="dot"></i> 研发工作空间 · 数据资产全生命周期管理</span><span>XUANZHI DATA STUDIO / 2026</span></footer>`}
function btn(label,action,name='plus',primary=false){return `<button class="btn ${primary?'primary':''}" data-action="${action}">${icon(name)}${label}</button>`}
function spark(color='#73b49a'){return `<svg class="spark" viewBox="0 0 90 32" aria-hidden="true"><path d="M0 29 9 23 17 25 26 15 35 20 44 12 54 15 64 6 75 11 88 1V32H0Z" fill="${color}" opacity=".1"/><path d="M0 29 9 23 17 25 26 15 35 20 44 12 54 15 64 6 75 11 88 1" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`}
function metrics(items){return `<div class="metrics">${items.map((m,i)=>`<div class="metric"><div class="label">${icon(['file','database','book','shield'][i])}${m[0]}</div><div class="value">${m[1]}<small>${m[2]}</small></div><div class="change"><b>${m[3]}</b>${m[4]||'较上一周期'}</div>${spark(i===2?'#85a3cd':'#73b49a')}</div>`).join('')}</div>`}
function productCards(){return `<div class="products">${Object.entries(products).map(([key,p])=>`<a href="#/dataset/${key}" class="product" style="--color:${p.color};--tint:${p.tint}"><div class="product-main"><div class="product-top"><div class="product-logo">${icon(p.icon)}</div><h3>${p.name} <small>${p.cn}</small></h3><span class="pill">v1.0 · 已就绪</span></div><p class="desc">${p.desc}</p><div class="product-stats"><strong>${fmt(p.count)}</strong><small>${p.unit}训练${key==='dpo'?'偏好':'语料'}</small><span class="tokens">${p.tokens}<small>Tokens</small></span></div><div class="splitbar"><i></i><i></i><i></i></div></div><div class="product-footer"><span>训练 90% / 验证 5% / 测试 5%</span><b>查看数据集 ↗</b></div></a>`).join('')}</div>`}
function flow(){return `<div class="flow"><div class="flow-stages"><div>原始文件<strong>8,000<small>个</small></strong></div><div>有效文件<strong>7,440<small>个</small></strong></div><div>结构化片段<strong>28,640<small>段</small></strong></div><div>训练数据<strong>4,300<small>条 / 对</small></strong></div></div><svg viewBox="0 0 680 105" preserveAspectRatio="none" aria-label="数据从原始文件流转为片段及训练数据"><defs><linearGradient id="flowGrad"><stop stop-color="#b8d8cc"/><stop offset="1" stop-color="#448f77"/></linearGradient></defs><path d="M3 4H153C196 4 195 11 225 11H330C361 11 366 2 395 2H505C541 2 543 23 570 23H677V82H570C543 82 541 102 505 102H395C366 102 361 94 330 94H225C195 94 196 101 153 101H3Z" fill="url(#flowGrad)" opacity=".7"/><path d="M3 28H153C196 28 195 34 225 34H330C361 34 366 26 395 26H505C541 26 543 41 570 41H677V64H570C543 64 541 78 505 78H395C366 78 361 72 330 72H225C195 72 196 77 153 77H3Z" fill="#fff" opacity=".18"/><path d="M164 0v105M340 0v105M518 0v105" stroke="#fff" stroke-width="3" opacity=".85"/></svg><div class="flow-caption"><span>解析与格式识别</span><span>清洗保留率 93.0%</span><span>切分与结构化</span><span>CPT / SFT / DPO</span></div></div>`}
function home(){return heading('训练数据中心','让每一份原始数据，成为模型成长的养分。',btn('查看血缘','lineage','nodes')+btn('接入数据','ingest','plus',true))+metrics([['原始文件','8,000','个','↑ 12.8%'],['有效片段','28,640','段','↑ 18.6%'],['训练数据','4,300','条 / 对','↑ 8.2%'],['质量通过率','96.8','%','↑ 2.4 pp']])+`<div class="section-head"><h2>数据资产 <small>按文件格式探索你的数据</small></h2><a class="btn text" href="#/data/all">查看全部 ${icon('arrow')}</a></div><div class="formats">${formats.map(f=>`<a class="format" href="#/data/${f[0].toLowerCase()}" style="--color:${f[2]};--tint:${f[3]}"><span class="fileicon">${f[0]}</span><span class="arrow">↗</span><strong>${f[0]}</strong><div class="count">${fmt(f[1])} <small>个文件</small></div><small>${f[4]}</small></a>`).join('')}</div><div class="section-head"><h2>训练数据集 <small>从知识积累，到能力塑造，再到偏好对齐</small></h2><span>3 类数据产品 · 统一版本管理</span></div>${productCards()}<div class="lower-grid"><section class="panel"><div class="panel-title"><h2>数据流转全景</h2><div class="legend"><span><i class="dot"></i>全工作空间</span><a href="#/lineage" style="color:var(--green)">探索血缘 ↗</a></div></div>${flow()}</section><section class="panel"><div class="panel-title"><h2>最近活动</h2><button class="btn text" data-action="notifications" style="font-size:10px">全部记录 ↗</button></div>${[['check','CPT 领域知识语料 v1.0 已就绪','2,000 篇 · 完成数据集切分','10 分钟前'],['sliders','文档清洗任务已完成','字符统一 → 隐私脱敏 → 质量过滤','32 分钟前'],['upload','新一批 PDF 文档已接入','128 个文件 · 研究论文','1 小时前']].map(a=>`<div class="activity"><span class="activity-icon">${icon(a[0])}</span><div><strong>${a[1]}</strong><p>${a[2]}</p></div><time>${a[3]}</time></div>`).join('')}</section></div>`+footer()}
function trend(){return `<svg class="trend" viewBox="0 0 500 175" preserveAspectRatio="none" aria-label="近30天接入趋势"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#64aa8e" stop-opacity=".25"/><stop offset="1" stop-color="#64aa8e" stop-opacity="0"/></linearGradient></defs>${[25,65,105,145].map((y,i)=>`<path d="M35 ${y}H490" stroke="#edf1f2" stroke-dasharray="3 4"/><text x="0" y="${y+3}" class="chart-axis">${300-i*100}</text>`).join('')}<path d="M35 131 51 125 68 133 85 111 101 114 118 102 134 119 151 87 167 102 184 95 200 67 217 77 233 96 250 81 266 61 283 71 300 47 317 59 333 76 350 48 366 56 383 33 400 44 417 26 433 41 450 24 467 36 488 16V145H35Z" fill="url(#area)"/><path d="M35 131 51 125 68 133 85 111 101 114 118 102 134 119 151 87 167 102 184 95 200 67 217 77 233 96 250 81 266 61 283 71 300 47 317 59 333 76 350 48 366 56 383 33 400 44 417 26 433 41 450 24 467 36 488 16" fill="none" stroke="#429d7f" stroke-width="2"/>${['06.01','06.07','06.14','06.21','06.30'].map((d,i)=>`<text x="${35+i*109}" y="169" class="chart-axis">${d}</text>`).join('')}</svg>`}
function distributionCharts(){return `<div class="chart-grid"><section class="panel"><div class="panel-title"><h2>近 30 天接入趋势</h2><span class="legend"><i class="dot"></i>每日接入 / 文件</span></div>${trend()}</section><section class="panel"><div class="panel-title"><h2>文本长度分布</h2><small>字符数</small></div><div class="bars">${[22,67,95,64,34].map((v,i)=>`<div class="bar" style="height:${v}%"><small>${['<500','500–1k','1k–3k','3k–5k','>5k'][i]}</small></div>`).join('')}</div></section><section class="panel"><div class="panel-title"><h2>语言分布</h2><small>按片段统计</small></div><div class="donutwrap"><div class="donut"><span>74<small>% 中文</small></span></div><div class="legend-vertical"><span><i class="dot"></i>中文 <b>74%</b></span><span><i class="dot" style="background:#8fb8ca"></i>英文 <b>18%</b></span><span><i class="dot" style="background:#e6c18e"></i>其他 <b>8%</b></span></div></div></section></div>`}
const fileNames=['领域知识与技术方法综述','数据治理实践指南','研究方法与评估框架','专业术语与知识体系','行业应用与案例分析'];
function fileRows(filter=''){const types=selectedFormat==='all'?['PDF','HTML','MD','TXT','DOCX']:Array(5).fill(selectedFormat.toUpperCase());return fileNames.map((name,i)=>({name:`${name}.${types[i].toLowerCase()}`,type:types[i],i})).filter(f=>f.name.toLowerCase().includes(filter.toLowerCase())).map(f=>`<tr><td><div class="filename"><span class="fileicon">${f.type}</span>${f.name}</div></td><td>${['论文','网页','书籍','书籍','论文'][f.i]}</td><td>${[128,64,92,36,108][f.i]} KB</td><td>${[24,16,32,12,28][f.i]} 段</td><td><span class="pill">${icon('check')} 已清洗</span></td><td>06-${30-f.i} 10:24</td><td><button class="table-link" data-action="compare" data-file="${f.i}">清洗对比</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有匹配的文件，请尝试其他关键词。</td></tr>'}
function dataPage(format){selectedFormat=formats.some(f=>f[0].toLowerCase()===format)?format:'all';const f=formats.find(f=>f[0].toLowerCase()===selectedFormat);const count=f?f[1]:8000;return heading(f?`${f[0]} 数据台`:'全部数据台','从来源到训练用途，了解这一批数据的每一步。',btn('查看血缘','lineage','nodes')+btn('接入数据','ingest','plus',true),'DATA EXPLORER')+`<div class="tabs" style="overflow:auto">${['all',...formats.map(f=>f[0].toLowerCase())].map(t=>`<a class="tab ${selectedFormat===t?'active':''}" href="#/data/${t}">${t==='all'?'全部格式':t.toUpperCase()}</a>`).join('')}</div>`+metrics([['接入文件',fmt(count),'个','↑ 12.8%'],['清洗保留',fmt(Math.round(count*.93)),'个','93.0%','文件保留率'],['结构化片段',fmt(Math.round(count*3.58)),'段','已完成','文本结构化'],['关联数据集','3','类','CPT / SFT / DPO','']])+`<section class="panel"><div class="panel-title"><h2>工作空间处理流转</h2><small>全格式汇总 · 每个阶段独立计量</small></div>${flow()}</section>${distributionCharts()}<section class="panel"><div class="panel-title"><h2>来源构成</h2><small>按当前格式文件数统计</small></div><div class="sourcebar"><i style="width:42%"></i><i style="width:30%"></i><i style="width:20%"></i><i style="width:8%"></i></div><div class="sources">${['网页','论文','书籍','其他文档'].map((s,i)=>`<div><i class="dot" style="background:${['#3c9c83','#85b3c4','#e0b37e','#b7aad0'][i]}"></i>${s}<b>${[42,30,20,8][i]}% <small style="font-size:10px;color:#a1acb3;font-weight:400"> · ${fmt(Math.round(count*[.42,.30,.20,.08][i]))} 个</small></b></div>`).join('')}</div></section><section class="panel" style="margin-top:17px"><div class="toolbar"><h2 style="font-size:13px">文件列表 <small style="color:#9aa6af;font-weight:400"> / 浏览前 5 个文件</small></h2><input id="fileSearch" class="input" placeholder="搜索文件名称…" aria-label="搜索文件名称"></div><div class="table-scroll"><table><thead><tr><th>文件名称</th><th>来源</th><th>大小</th><th>片段数</th><th>处理状态</th><th>接入时间</th><th>操作</th></tr></thead><tbody id="fileRows">${fileRows()}</tbody></table></div><div class="table-foot"><span>展示 5 个文件的处理详情</span><a href="#/lineage" style="color:var(--green)">追溯处理过程 →</a></div></section><div class="section-head"><h2>这些数据被用在哪里</h2><span>点击查看训练用途与样本</span></div>${productCards()}`+footer()}
function datasetPage(type){const p=products[type]||products.cpt;return heading(`${p.name} ${p.cn}数据集`,p.desc,btn('导出当前样本','export','download')+btn('构建新版本','build','plus',true),'TRAINING DATASETS')+`<div class="tabs">${[['overview','数据概览'],['samples','样本浏览'],['build','构建新版本']].map(([key,label])=>`<button class="tab ${datasetTab===key?'active':''}" data-tab="${key}">${label}</button>`).join('')}</div>`+(datasetTab==='samples'?sampleBrowser(type):datasetTab==='build'?buildPage(type):metrics([['训练数据',fmt(p.count),p.unit,'v1.0','当前数据版本'],['训练集',fmt(p.count*.9),p.unit,'90%','用于模型训练'],['验证集',fmt(p.count*.05),p.unit,'5%','用于调参与验证'],['测试集',fmt(p.count*.05),p.unit,'5%','独立效果评估']])+`<section class="panel"><div class="panel-title"><h2>来源与去向</h2><a href="#/lineage" class="btn text" style="font-size:10px">查看完整血缘 ↗</a></div><div style="display:grid;grid-template-columns:1fr auto 1.2fr auto 1fr;gap:22px;align-items:center;padding:12px 0"><div style="font-size:12px;line-height:2.8;color:#7e919e">网页知识 <span style="float:right">42%</span><br>研究论文 <span style="float:right">30%</span><br>书籍与其他 <span style="float:right">28%</span></div><span style="color:#a1bcb0">→</span><div style="border:1px solid #deebe4;background:${p.tint};border-radius:8px;text-align:center;padding:25px 8px"><strong style="color:${p.color}">${p.name} ${p.cn}</strong><p style="font-size:11px;margin-top:10px;color:#8a9b92">${fmt(p.count)} ${p.unit} · ${p.tokens} Tokens</p></div><span style="color:#a1bcb0">→</span><div style="font-size:11px;line-height:2.8;color:#82958a">训练集 <b style="float:right;color:#527e65">90%</b><br>验证集 <b style="float:right;color:#799e88">5%</b><br>测试集 <b style="float:right;color:#9bb8a7">5%</b></div></div></section>${distributionCharts()}<div class="section-head"><h2>看看数据的样子</h2><button class="btn text" data-tab="samples">浏览样本 ${icon('arrow')}</button></div><section class="panel">${sampleContent(type,0)}</section>`)+footer()}
function sampleContent(type,index){const topics=sampleTopics[index];if(type==='sft')return `<div class="sample-meta"><span>SFT-${String(index+1).padStart(5,'0')} · ${topics}</span><span class="pill">训练集 · 中文 · 2 轮对话</span></div><div class="bubble"><span class="bubble-avatar">用户</span><p>${['训练数据在进入模型之前，为什么需要进行质量清洗？','如何在保留语义的前提下对文本进行隐私脱敏？','为什么不能把同一篇文档的片段随机分到训练集和测试集？'][index]}</p></div><div class="bubble assistant"><span class="bubble-avatar">助手</span><p>${['质量清洗可以减少噪声和偏差，让模型学习到更可靠的知识。通常包括三个步骤：<br>1. 统一文本编码与字符，移除多余空白。<br>2. 识别并脱敏电话号码、邮箱等敏感信息。<br>3. 过滤内容缺失、重复或缺乏信息价值的片段。<br>清洗后的数据还需要保留来源信息，方便后续追溯与验证。','可以先识别敏感实体，再用稳定的类型占位符替换，例如将电话号码替换为 [手机号]。同一主体在上下文中保持一致的替换标识，有助于保留指代关系。完成后应检查是否遗漏了组合起来能够识别个人的信息。','同一文档中的片段通常共享上下文和措辞。如果这些片段出现在不同集合中，测试结果可能高估模型的泛化能力。更稳妥的做法是按原始文档分组，再将文档组分配到训练、验证和测试集。'][index]}</p></div>`;if(type==='dpo')return `<div class="sample-meta"><span>DPO-${String(index+1).padStart(5,'0')} · ${topics}</span><span class="pill">训练集 · 成对偏好</span></div><div style="font-size:12px;padding:15px 17px;background:#f5f7f9;border-radius:7px;color:#637783">用户问题：${['清洗训练语料时，如何处理包含个人信息的文本？','数据清洗后如何判断质量是否提升？','如何避免训练数据和测试数据之间的信息泄漏？'][index]}</div><div class="pair"><article class="answer"><h3>✓ 优选回答</h3>${['先识别电话号码、邮箱和身份证号等敏感信息，再根据用途使用占位符脱敏，保留其余有价值的上下文。对无法可靠脱敏的片段进行隔离复核，并记录处理规则和数据来源。','先固定一组具有代表性的检查样本，对比清洗前后的完整性、噪声率和敏感信息残留；同时检查有效内容是否被误删。对关键问题加入人工复核，保留各阶段的输入输出数量。','按原始来源分组切分，并检查跨集合的完全重复和近似重复。测试集在构建后保持独立，避免将其内容用于生成训练样本或反复调整处理规则。'][index]}<small>偏好理由：步骤具体、边界明确，保留了可操作的处理建议。</small></article><article class="answer rejected"><h3>− 非优选回答</h3>${['直接删除所有带数字的文本就可以了，这样能保证没有隐私信息。','清洗后剩余的条数越少，说明质量越高。','随机打乱所有片段，再按照比例分成三个集合就可以完全避免泄漏。'][index]}<small>偏好理由：结论过度简化，缺少必要的验证与例外处理。</small></article></div>`;return `<div class="sample-meta"><span>CPT-${String(index+1).padStart(5,'0')} · 来源：${['论文','书籍','网页'][index]}</span><span class="pill">训练集 · 中文 · 已清洗</span></div><article class="sample-copy"><h3>${topics}</h3><p>${['高质量的领域训练语料，是模型理解专业概念与建立知识关联的基础。数据治理不仅关注文档数量，还需要兼顾来源覆盖、内容完整性以及概念表达的一致性。<br><br>在语料整理过程中，应保留原始文档与结构化片段之间的关系。每个片段记录其出处、清洗过程和后续用途，使数据从接入、加工到训练使用的全过程可以追溯。','文本清洗通常从编码和字符规范化开始，逐步完成空白整理、敏感信息识别和低质量片段过滤。每个环节均需保留可比较的输入输出记录。<br><br>隐私保护并不意味着删除所有包含个人信息的文档。通过适当的占位符替换与人工复核，可以在减少敏感信息暴露的同时，保留具有训练价值的上下文。','训练集、验证集和测试集承担不同的职责。训练集用于参数学习，验证集用于选择配置，测试集用于独立评估模型的最终效果。<br><br>为了减少数据泄漏，应尽可能按来源文档或关联实体进行分组切分。固定随机种子可以帮助复现切分结果，但仍需要结合重复检测与来源核验。'][index]}</p></article>`}
function sampleBrowser(type){return `<section class="panel"><div class="toolbar"><h2 style="font-size:13px">样本浏览</h2><span style="font-size:10px;color:#94a4ae">${products[type].name} · v1.0 · 展示 3 条样本</span></div><div class="sample-layout"><div class="sample-list">${sampleTopics.map((t,i)=>`<button class="sample-item ${sampleIndex===i?'active':''}" data-sample="${i}">${t}<small>${products[type].name}-${String(i+1).padStart(5,'0')} · 训练集</small></button>`).join('')}</div><div>${sampleContent(type,sampleIndex)}</div></div></section>`}

function ingestPage(){return heading('数据接入','把原始内容变成干净、可追溯的训练语料。',btn('查看数据台','data','database'),'DATA INGESTION')+`<section class="panel"><div class="panel-title"><h2>01 / 选择文件</h2><small>支持 8 种常用格式</small></div><label class="drop" for="fileInput">${icon('upload')}<strong id="uploadLabel">拖拽文件到这里，或点击选择文件</strong><small>PDF · HTML · MD · TXT · DOCX · CSV · JSON · JSONL</small><input id="fileInput" type="file" multiple hidden></label><div class="toolbar" style="justify-content:start"><span style="font-size:11px;color:#82968a">解析器</span><select class="input" aria-label="选择解析器"><option>根据文件格式自动选择</option><option>文本解析器</option><option>JSONL 解析器</option><option>CSV 解析器</option><option>DOCX 解析器</option></select><span style="font-size:10px;color:#9baaa2">未知格式先尝试读取文本</span></div></section><section class="panel" style="margin-top:18px"><div class="panel-title"><h2>02 / 清洗流程</h2><span class="pill">默认处理方案</span></div><div class="workflow">${[['01','解析与切分','1,000','1,000'],['02','统一字符','1,000','1,000'],['03','隐私脱敏','1,000','1,000'],['04','低质内容过滤','1,000','930'],['05','清洗完成','930','930']].map(s=>`<div class="step"><span class="step-num">STEP ${s[0]}</span><b>${s[1]}</b><p>输入 ${s[2]} 条</p><p>保留 <strong>${s[3]} 条</strong></p></div>`).join('')}</div><div style="display:flex;gap:20px;font-size:10px;color:#899e92"><span>字符统一：修改 328 条</span><span>隐私脱敏：修改 64 条</span><span>质量过滤：移除 70 条</span></div><div class="section-head"><h2 style="font-size:12px">处理前后对比</h2><button class="btn text" data-action="compare" style="font-size:10px">展开查看 ↗</button></div>${compareMarkup()}</section><section class="panel" style="margin-top:18px"><div class="panel-title"><h2>03 / 导出与后续用途</h2><small>保留数据来源与处理记录</small></div><div class="toolbar" style="margin:0"><div style="display:flex;gap:10px;align-items:center;color:#8da095;font-size:11px">导出格式<select class="input" id="ingestExport"><option>JSONL</option><option>Markdown</option><option>CSV</option><option>TXT</option></select></div><div class="actions">${btn('查看清洗样本','compare','file')}${btn('导出当前样本','ingest-export','download',true)}</div></div></section>`+footer()}
function compareMarkup(){return `<div class="compare"><article><h3>清洗前 · 原始文本</h3>数据治理<del>　　</del>是提升语料质量的重要环节。<br>联系邮箱：<del>research@example.com</del><br><del>了解更多 &gt;&gt; 点击关注 &gt;&gt;</del><br>应保留<del>\u3000</del>文档来源与处理记录。</article><article><h3>清洗后 · 规范化文本</h3>数据治理是提升语料质量的重要环节。<br>联系邮箱：<mark>[邮箱]</mark><br>应保留文档来源与处理记录。<br><span style="color:#98b2a0;font-size:10px">空白规范化 · 个人信息脱敏 · 导航噪声移除</span></article></div>`}
const nodes=[['source','原始来源','研究论文','来源类别',15,143],['file','原始文件','领域知识综述.pdf','128 KB · 24 个片段',175,143],['normalize','清洗算子','统一字符','处理 24 · 保留 24',337,25],['privacy','清洗算子','隐私脱敏','处理 24 · 修改 3',337,143],['quality','清洗算子','低质内容过滤','处理 24 · 保留 22',337,261],['segment','结构化片段','领域知识片段','22 个有效片段',500,143],['sample','训练样本','CPT 知识语料','12 篇训练记录',661,143],['dataset','训练数据集','CPT 领域知识 v1.0','训练 / 验证 / 测试',822,143]];
const nodeInfo={source:'来源类别为研究论文。来源信息帮助说明内容从哪里进入工作空间。',file:'原始文件被解析为 24 个片段。文件与片段之间保留关联，便于返回原文核查。',normalize:'统一全角字符、换行与连续空白。输入 24 个片段，保留 24 个，其中 8 个发生文本修改。',privacy:'检测并替换邮箱等敏感内容。输入 24 个片段，保留 24 个，其中 3 个完成脱敏。',quality:'过滤内容过短或缺乏有效信息的片段。输入 24 个片段，过滤 2 个，保留 22 个。',segment:'清洗后得到 22 个有效片段，每个片段都可以追溯到原始文件和处理步骤。',sample:'将相关片段组织为 12 篇 CPT 训练记录，并保留样本与片段的对应关系。',dataset:'训练记录归入 CPT 领域知识数据集 v1.0。整个数据集按来源分组，以 90/5/5 切分。'};
function lineagePage(){return heading('数据血缘','从一份文件出发，看见每一步加工与每一种训练用途。',btn('查看原始文件','data','file'),'DATA LINEAGE')+`<section class="panel"><div class="toolbar"><div><h2 style="font-size:13px">领域知识综述.pdf</h2><p style="font-size:10px;color:#9aa8a1;margin-top:7px">来源 → 文件 → 算子链 → 片段 → 样本 → 数据集</p></div><span class="legend"><span><i class="dot"></i>8 个节点</span><span>7 条关联</span></span></div><div class="graph-scroll"><div class="graph"><svg viewBox="0 0 970 365" preserveAspectRatio="none"><defs><marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#96b5a6"/></marker></defs><g fill="none" stroke="#a8c6b8" stroke-width="1.5" marker-end="url(#arrowhead)"><path d="M141 185H175"/><path d="M301 185C322 185 315 67 337 67"/><path d="M400 109V143"/><path d="M400 227V261"/><path d="M463 303C488 303 475 185 500 185"/><path d="M626 185H661"/><path d="M787 185H822"/></g><g class="graph-label"><text x="147" y="172">提供</text><text x="305" y="113">解析</text><text x="409" y="129">继续处理</text><text x="409" y="247">继续处理</text><text x="476" y="265">输出</text><text x="630" y="172">构成</text><text x="790" y="172">收录</text></g></svg>${nodes.map(n=>`<button class="gnode ${n[0]==='file'?'selected':''}" style="left:${n[4]}px;top:${n[5]}px" data-node="${n[0]}"><small>${n[1]}</small><b>${n[2]}</b><span>${n[3]}</span></button>`).join('')}</div></div><div class="node-detail" id="nodeDetail">${icon('file')}<div><strong>原始文件 · 领域知识综述.pdf</strong><br>${nodeInfo.file}</div></div></section><div class="lower-grid"><section class="panel"><div class="panel-title"><h2>处理链的输入与输出</h2><small>以片段为单位</small></div><table><thead><tr><th>处理步骤</th><th>输入</th><th>保留</th><th>变化</th></tr></thead><tbody><tr><td>统一字符</td><td>24</td><td>24</td><td>8 个片段被修改</td></tr><tr><td>隐私脱敏</td><td>24</td><td>24</td><td>3 个片段被脱敏</td></tr><tr><td>低质内容过滤</td><td>24</td><td>22</td><td>2 个片段被过滤</td></tr></tbody></table></section><section class="panel"><div class="panel-title"><h2>关联训练数据集</h2><span class="pill">v1.0</span></div><h3 style="font-size:16px;margin:23px 0 10px">CPT 领域知识语料</h3><p style="font-size:11px;color:#8a9e92;line-height:1.9">当前文件贡献 12 篇训练记录。<br>数据集共包含 2,000 篇语料。</p><a class="btn text" href="#/dataset/cpt" style="margin-top:18px">查看训练数据集 ${icon('arrow')}</a></section></div>`+footer()}
function route(){const parts=location.hash.replace(/^#\/?/,'').split('/');return {page:parts[0]||'home',arg:parts[1]||'all'}}
function render(){const r=route();let html,title,nav;if(r.page==='data'){html=dataPage(r.arg);title='数据台';nav='data'}else if(r.page==='dataset'){const type=products[r.arg]?r.arg:'cpt';html=datasetPage(type);title=`${products[type].name} 训练数据集`;nav=type}else if(r.page==='ingest'){html=ingestPage();title='数据接入';nav='ingest'}else if(r.page==='lineage'){html=lineagePage();title='数据血缘';nav='lineage'}else{html=home();title='训练数据中心';nav='home'}document.getElementById('app').innerHTML=`<div class="fade">${html}</div>`;document.getElementById('breadcrumb').textContent=title;document.title=`${title} · 玄知数据`;document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===nav));document.getElementById('sidebar').classList.remove('open');decorate();const fs=document.getElementById('fileSearch');if(fs)fs.addEventListener('input',()=>document.getElementById('fileRows').innerHTML=fileRows(fs.value));const input=document.getElementById('fileInput');if(input){input.addEventListener('change',()=>showFiles(input.files));const drop=document.querySelector('.drop');drop.addEventListener('dragover',e=>e.preventDefault());drop.addEventListener('drop',e=>{e.preventDefault();showFiles(e.dataTransfer.files)})}}

function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4200)}

function closeModal(){document.getElementById('modalRoot').innerHTML='';document.body.style.overflow='';lastFocus?.focus()}
function exportModal(){modal('导出当前样本',`<p>选择一种格式，下载当前数据集展示的 3 条样本。正式数据集导出将在业务实现阶段接入。</p><label style="display:grid;gap:10px;margin:23px 0;font-size:12px;color:#6c8274">文件格式<select class="input" id="exportFormat"><option>JSONL</option><option>Markdown</option><option>CSV</option><option>TXT</option></select></label><div class="actions" style="justify-content:end">${btn('下载样本','download','download',true)}</div>`)}
function exportSamples(format,type){const records=type==='cleaned'?[{id:'CLEAN-00001',topic:'数据治理',split:'unassigned',text:'数据治理是提升语料质量的重要环节。\n联系邮箱：[邮箱]\n应保留文档来源与处理记录。'}]:sampleTopics.map((topic,i)=>{const holder=document.createElement('div');holder.innerHTML=sampleContent(type,i);return {id:`${type.toUpperCase()}-${String(i+1).padStart(5,'0')}`,topic,split:'train',text:holder.innerText}});let content,ext,mime;const csv=s=>'"'+s.replaceAll('"','""')+'"';if(format==='CSV'){content='\uFEFFid,topic,split,text\r\n'+records.map(r=>Object.values(r).map(csv).join(',')).join('\r\n');ext='csv';mime='text/csv'}else if(format==='Markdown'){content=records.map(r=>`## ${r.id} · ${r.topic}\n\n${r.text}`).join('\n\n---\n\n');ext='md';mime='text/markdown'}else if(format==='TXT'){content=records.map(r=>r.text).join('\n\n');ext='txt';mime='text/plain'}else{content=records.map(r=>JSON.stringify(r)).join('\n')+'\n';ext='jsonl';mime='application/x-ndjson'}const url=URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`xuanzhi-${type}-preview-samples.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${records.length} 条${type==='cleaned'?'清洗':type.toUpperCase()}样本 · ${format}`)}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){datasetTab=tab.dataset.tab;render();return}const sample=e.target.closest('[data-sample]');if(sample){sampleIndex=Number(sample.dataset.sample);render();return}const node=e.target.closest('[data-node]');if(node){document.querySelectorAll('.gnode').forEach(n=>n.classList.remove('selected'));node.classList.add('selected');const n=nodes.find(n=>n[0]===node.dataset.node);document.getElementById('nodeDetail').innerHTML=icon('nodes')+`<div><strong>${n[1]} · ${n[2]}</strong><br>${nodeInfo[n[0]]}</div>`;return}if(e.target.classList.contains('modal-backdrop')){closeModal();return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;const r=route();if(action==='close')closeModal();else if(['ingest','lineage','data'].includes(action))location.hash='/'+(action==='data'?'data/all':action);else if(action==='build'){datasetTab='build';render()}else if(action==='export')exportModal();else if(action==='download'){const format=document.getElementById('exportFormat').value;exportSamples(format,products[r.arg]?r.arg:'cpt');closeModal()}else if(action==='ingest-export')exportSamples(document.getElementById('ingestExport').value,'cleaned');else if(action==='compare')modal('清洗前后对比',`<p>同一条记录在字符统一、隐私脱敏与质量处理前后的变化。</p>${compareMarkup()}<div class="actions" style="justify-content:end"><a class="btn" href="#/lineage" onclick="closeModal()">查看处理血缘 ↗</a></div>`);else if(action==='advanced')modal('高级工具',`<p>资产中心、处理中心与质量审核将保留现有业务能力，统一收纳在「高级工具」分组下。本次界面预览聚焦训练数据中心的新流程。</p>`);else if(action==='notifications')modal('工作空间动态',`<div class="activity"><span class="activity-icon">${icon('check')}</span><div><strong>CPT 领域知识语料 v1.0 已就绪</strong><p>2,000 篇 · 训练集 1,800 / 验证集 100 / 测试集 100</p></div></div><div class="activity"><span class="activity-icon">${icon('sliders')}</span><div><strong>文档清洗任务已完成</strong><p>输入 1,000 条 · 保留 930 条 · 过滤 70 条</p></div></div><div class="activity"><span class="activity-icon">${icon('upload')}</span><div><strong>128 个 PDF 文件已接入</strong><p>来源类别：研究论文</p></div></div>`);else if(action==='search'){location.hash='/data/all';setTimeout(()=>document.getElementById('fileSearch')?.focus(),60)}else if(action==='build-preview'){const values=[...document.querySelectorAll('.split-controls input')].map(n=>Number(n.value));if(values.some(v=>v<0||v>100)||values.reduce((a,b)=>a+b,0)!==100){toast('训练、验证和测试比例需要合计为 100%。');return}modal('构建配置预览',`<p>数据类型：${products[r.arg]?.name||'CPT'}<br>切分比例：${values.join(' / ')}<br>切分策略：按原始文档分组<br>随机种子：42</p><p style="margin-top:18px">这里用于确认交互流程。此 HTML 不会创建真实的数据集版本或执行后台任务。</p>`)}});
document.getElementById('advancedToggle').addEventListener('click',e=>{const el=document.getElementById('advanced');el.hidden=!el.hidden;e.currentTarget.setAttribute('aria-expanded',String(!el.hidden))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('sidebar').classList.remove('open')}if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();location.hash='/data/all';setTimeout(()=>document.getElementById('fileSearch')?.focus(),60)}if(e.key==='Tab'&&document.querySelector('.modal')){const focusables=[...document.querySelector('.modal').querySelectorAll('button,a,input,select,[tabindex="0"]')];const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{datasetTab='overview';sampleIndex=0;render();window.scrollTo(0,0)});render();
</script>
</body>
</html>
