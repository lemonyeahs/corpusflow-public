function assignDatasetSplits(samples,conf){const ids=unique(samples.map(s=>s.source_id)).sort();const n=ids.length;const evalCount=conf.splitTest>0?Math.max(1,Math.round(n*conf.splitTest/100)):0;const valCount=conf.splitDev>0?Math.max(1,Math.round(n*conf.splitDev/100)):0;const needed=evalCount+valCount+(conf.splitTrain>0?1:0);if(n<needed)return null;const splitBySource=Object.fromEntries(ids.map((id,i)=>[id,i<n-evalCount-valCount?'train':i<n-evalCount?'validation':'test']));return {splitBySource,counts:{train:ids.filter(id=>splitBySource[id]==='train').length,validation:valCount,test:evalCount},sourceGroups:n}}

  if(sub==='publish'){if(!permit('publish'))return;let failed=datasetGates().filter(x=>!x.ok);if(failed.length){notify('发布阻断：'+failed.map(x=>x.name).join('、'),true);return}if(!/^v\d+\.\d+\.\d+$/.test(C.dsConfig.version)){notify('版本必须使用 v1.0.0 格式',true);return}if(DB.datasetVersions.some(d=>d.name===C.dsConfig.name&&d.version===C.dsConfig.version)){notify('同名数据集版本已存在',true);return}let allocations=assignDatasetSplits(C.candidates,C.dsConfig),samples=C.candidates.map(x=>({...structuredClone(x),split:allocations.splitBySource[x.source_id]})),now=stamp(),id='DS-V3-'+String(DB.datasetVersions.length+1).padStart(3,'0'),sources=unique(samples.map(s=>s.source_id));let rec={id,name:C.dsConfig.name,type:C.datasetType,version:C.dsConfig.version,status:'演示已发布',sample_count:samples.length,tokens:samples.reduce((n,s)=>n+s.tokens,0),build_id:C.buildId,sourceIds:sources,created:now,samples,manifest:{config_version:C.buildId,config:structuredClone(C.dsConfig),license_check:true,evidence_check:true,splits:{train:C.dsConfig.splitTrain,val:C.dsConfig.splitDev,test:C.dsConfig.splitTest},actual_source_group_counts:allocations.counts,immutable:true}};DB.datasetVersions.push(rec);for(let x of samples){DB.lineageEdges.push({from:x.segment_id,to:x.id,relation:'evidence'});DB.lineageEdges.push({from:x.id,to:id,relation:'included_in'})}C.publishedId=id;DB.datasetBuilds.find(b=>b.id===C.buildId).status='演示已发布';audit('创建演示发布版本',id,C.dsConfig.version);notify('已生成不可变演示发布快照 '+id);C.releaseDetails=id;C.tab.dataset='releases';v3Render();return}
  if(sub==='release'){C.releaseDetails=key;C.tab.dataset='releases';C.page='datasets';v3Render();return}
  if(sub==='build'&&key==='open'){return}
  if(sub==='build'&&t[2]==='open'){let r=DB.datasetBuilds.find(b=>b.id===t[3]);if(r){C.candidates=r.candidates;C.buildId=r.id;C.dsConfig=structuredClone(r.config);C.wizard=5;C.tab.dataset='wizard';v3Render()}return}
 }
 if(type==='rag'){
  if(sub==='search'){C.ragSearched=true;C.page='rag';notify('已展示模拟检索轨迹（没有实际模型或索引请求）');v3Render();return}
  if(sub==='feedback'){if(!C.ragSearched||!C.ragFeedback){notify('请选择反馈类型并先执行模拟检索',true);return}let source='SRC-0001',issueId='';if(C.ragFeedback!=='正确'){issueId='ISSUE-V3-'+String(DB.qualityIssues.length+1).padStart(3,'0');DB.qualityIssues.push({id:issueId,doc:source,stage:'下游验证',reason:'RAG 反馈：'+C.ragFeedback,status:'pending',action:'检查证据与内容',detail:'用户反馈关联的知识片段需人工确认'});audit('RAG 质量反馈',issueId,C.ragFeedback)}C.ragHistory=C.ragHistory||[];C.ragHistory.unshift({type:C.ragFeedback,source,issue:issueId});notify('反馈已回流本地质量队列');C.ragFeedback='';v3Render();return}
 }
 if(type==='system'){
  if(sub==='integration'){C.modal='integration:'+key;v3Render();return}
  if(sub==='test'){notify('DEMO：未连接真实服务，不能声明网络连通或认证成功。');return}
  if(sub==='save'){if(!permit('settings'))return;let i=DB.integrations.find(i=>i.id===key);if(i){i.endpoint=cfval('integration-endpoint');i.authentication=cfval('integration-auth');i.status=i.endpoint?'已填写配置 · 未连接':'未连接';audit('配置集成占位',i.name,'仅本地界面演示');C.modal='';notify('配置已保存到当前页面内存，未连接服务');v3Render()}return}
 }
 if(type==='modal'){C.modal='';v3Render();return}
}
function saveJson(name,obj){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出当前可见演示元数据，不包含实际文件内容')}
const v2DagSvg=dagSvg;
dagSvg=function(){return v2DagSvg().replaceAll('SFT 构建','结构化入库');};
function v3Modal(){if(!C.modal)return '';if(C.modal.startsWith('integration:')){let i=DB.integrations.find(i=>i.id===C.modal.split(':')[1]);return `<div class="v3-overlay" data-v3="modal.close"><section class="dialog v3-dialog" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="flex-between"><h2>配置 ${esc(i.name)}</h2>${action('关闭','modal.close')}</div><p>${esc(i.description)} · 演示配置界面，不写入真实凭证</p><div class="field"><label>服务地址（仅本地文字记录）</label><input class="input full" id="integration-endpoint" placeholder="https://service.example/api" value="${esc(i.endpoint)}" /></div><div class="field"><label>认证方式</label><select class="select full" id="integration-auth">${opt(['未配置','API Key（占位）','OAuth（占位）','内部服务认证'],i.authentication||'未配置')}</select></div><div class="notice-inline warn">请勿输入真实密钥，当前没有安全凭据存储或服务端鉴权。</div><div class="toolrow">${action('保存演示配置','system.save.'+i.id,'primary',!allow('settings')?'disabled':'')}${action('取消','modal.close')}</div></section></div>`}
 if(C.modal.startsWith('source:'))return `<div class="v3-overlay" data-v3="modal.close"><section class="dialog v3-dialog" role="dialog" onclick="event.stopPropagation()"><h2>配置外部数据源</h2><p>仅将连接配置保存到当前页面内存，不会接入外部网络或存储认证密钥。</p><div class="v3-form"><div class="field"><label>来源名称 *</label><input class="input full" id="source-name" placeholder="例如：OpenAlex 学术索引" /></div><div class="field"><label>类型</label><input readonly class="input full" value="${esc(['OpenAlex','Crossref','arXiv','Hugging Face Datasets','GitHub','S3 / MinIO','本地共享目录','自定义 REST API'][Number(C.modal.split(':')[1])]||'自定义')}" /></div><div class="field wide"><label>访问地址</label><input class="input full" id="source-endpoint" placeholder="https://example.org/api" /></div><div class="field"><label>认证方式</label><select class="select full" id="source-auth"><option>无</option><option>API Key（仅类型，不填写密钥）</option><option>OAuth（计划）</option></select></div><div class="field"><label>同步方式</label><select class="select full" id="source-sync"><option>手动</option><option>每日（计划）</option><option>定期（计划）</option></select></div></div><div class="toolrow">${action('保存本地连接器配置','ingest.source-save','primary',!allow('ingest')?'disabled':'')}${action('取消','modal.close')}</div></section></div>`;
 return '';
}
function loginUI(){return `<div class="v3-login"><div class="v3-login-left"><span class="v3-login-icon">C</span><h1>CorpusFlow</h1><h2>可追溯的大模型数据工程平台</h2><p>管理原始接入、结构化加工、质量治理、数据集发布与下游效果验证的完整生命周期。</p><div class="v3-login-flow">Source → Asset → Document → Segment → Dataset</div></div><section class="v3-login-form"><div class="app-label">PROTOTYPE V3 / LOCAL DEMO</div><h2>欢迎进入数据工作空间</h2><p>使用演示账号进入。以下不是安全认证，不存储密码，不连接身份提供方。</p><div class="field"><label>用户名</label><input id="login-user" class="input full" placeholder="演示用户" value="演示用户" /></div><div class="field"><label>密码（仅视觉展示）</label><input id="login-password" type="password" class="input full" placeholder="本地演示无需真实密码" /></div><div class="field"><label>演示角色</label><select id="login-role" class="select full">${opt(Object.keys(perms),CF.session.role)}</select></div><button id="login-button" class="btn primary full">进入演示工作空间</button><div class="notice-inline">ⓘ 本地模拟登录，没有服务端身份校验或真实安全保障。</div></section></div>`}
function v3Render(){state.page=C.page;drawNav();let maps={overview:v3Overview,ingest:v3Ingest,assets:v3Assets,structure:v3Structure,pipeline:v3Pipeline,quality:v3Quality,trace:v3Trace,datasets:v3Datasets,rag:v3Rag,system:v3System};
 try{$('content').innerHTML=(maps[C.page]||v3Overview)();}catch(e){$('content').innerHTML='<div class="card card-pad"><h2>页面渲染出现问题</h2><p>请在控制台查看详细错误并检查当前交互状态。</p></div>';console.error('V3 render',e)}
 let n=V3_NAV.flatMap(g=>g.items).find(item=>item[0]===C.page);$('breadcrumb').textContent=n?.[1]||'总览工作台';$('sidebar').classList.remove('mobile-open');let old=$('v3-dialog-root');if(old)old.remove();let div=document.createElement('div');div.id='v3-dialog-root';div.innerHTML=v3Modal()+(CF.session.loggedIn?'':loginUI());document.body.appendChild(div);
 let right=document.querySelector('.topright');if(right){right.innerHTML=`<span class="stage-pill">● DEMO · 本地模式</span><select class="select v3-role" aria-label="当前演示角色" data-field="session.role">${opt(Object.keys(perms),CF.session.role)}</select><button class="btn tiny" data-v3="session.logout" aria-label="退出演示">退出</button><div class="avatar">${esc(CF.session.role[0])}</div>`;}
}
drawNav=function(){ $('nav').innerHTML=V3_NAV.map(g=>`<div class="nav-label">${esc(g.name)}</div>${g.items.map(([id,title,ico])=>`<button class="nav-btn ${C.page===id?'active':''}" data-v3="nav.${id}"><span class="ico">${ico}</span>${esc(title)}</button>`).join('')}`).join('');};
render=v3Render;
go=function(p){C.page=p;C.modal='';C.drawer='';v3Render();window.scrollTo(0,0)};
// Capture V3 control actions before the V2 delegated events, and enforce demo role constraints.
document.addEventListener('click',e=>{
 let el=e.target.closest('[data-v3]');if(el){e.preventDefault();e.stopImmediatePropagation();if(!CF.session.loggedIn){notify('请先进入演示工作空间',true);return}let key=el.dataset.v3;
  if(key==='session.logout'){CF.session.loggedIn=false;audit('演示退出','SESSION');v3Render();return}
  doV3(key);return;
 }
 let legacy=e.target.closest('[data-action]');if(legacy){let ac=legacy.dataset.action,protectedOp=/^(pipeline:(new|save|retry|next)|op:|asset:register)/.test(ac);if(protectedOp&&!allow('process')&&!ac.startsWith('asset:register')){e.preventDefault();e.stopImmediatePropagation();notify('当前角色无法修改处理任务或算子配置',true);return}
  if(ac==='pipeline:retry'||ac==='pipeline:next'){e.preventDefault();e.stopImmediatePropagation();let run=DB.pipelineRuns.find(r=>r.id===state.pipeline.run);if(run){if(ac==='pipeline:retry')v3Resume(run);else v3StepRun(run)}return}
  if(ac==='pipeline:new'){e.preventDefault();e.stopImmediatePropagation();let run=newRun('SRC-0001');notify('已创建 '+run.id);v3Render();return}
 }
},true);
// All inputs are bound to the explicit mock state; neither file bytes nor credentials leave the page.
document.addEventListener('dragover',e=>{if(e.target.closest('#v3-drop')){e.preventDefault();e.dataTransfer.dropEffect='copy'}});
document.addEventListener('drop',e=>{if(!e.target.closest('#v3-drop'))return;e.preventDefault();C.ingestFiles=[...e.dataTransfer.files].map(f=>({name:f.name,size:f.size,format:(f.name.split('.').pop()||'未知').toUpperCase()}));notify('已选择 '+C.ingestFiles.length+' 份本地文件（未上传）');v3Render()});
document.addEventListener('change',e=>{let el=e.target;
 if(el.id==='v3-files'||el.id==='v3-folder'){C.ingestFiles=[...el.files].map(f=>({name:f.webkitRelativePath||f.name,size:f.size,format:(f.name.split('.').pop()||'未知').toUpperCase()}));v3Render();return}
 if(el.dataset.assetCheck){if(el.checked)C.selectedAssets.add(el.dataset.assetCheck);else C.selectedAssets.delete(el.dataset.assetCheck);v3Render();return}
 if(el.dataset.aiCheck!==undefined){let n=Number(el.dataset.aiCheck);if(el.checked)C.aiSelected.add(n);else C.aiSelected.delete(n);return}
 if(el.dataset.flag){let [group,k]=el.dataset.flag.split('.');(group==='dsConfig'?C.dsConfig:C.ingest)[k]=el.checked;return}
 if(el.dataset.field){let name=el.dataset.field,value=el.value;setV3Field(name,value);return}
},true);
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.field){setV3Field(el.dataset.field,el.value,false)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-field="assetFilters.text"]')){e.preventDefault();doV3('assets.apply')}if(e.key==='Escape'&&(C.drawer||C.modal)){C.drawer='';C.modal='';v3Render()}},true);
function setV3Field(name,value,rerender=true){let target=C,key=name;if(name.startsWith('assetFilters.')){target=C.assetFilters;key=name.slice(13)}else if(name.startsWith('struct.')){target=C.struct;key=name.slice(7)}else if(name.startsWith('ingest.')){target=C.ingest;key=name.slice(7)}else if(name.startsWith('dsConfig.')){target=C.dsConfig;key=name.slice(9)}else if(name==='session.role'){CF.session.role=value;audit('切换演示角色',value);notify('角色已切换为 '+value);v3Render();return} else if(name==='pipelineTemplate'){C.pipelineTemplate=value;state.pipeline.version=value}else if(name==='lineageDoc'){C.lineageDoc=value;C.lineageNode='source'}
 if(target===C.dsConfig&&['count','splitTrain','splitDev','splitTest'].includes(key))value=Number(value);target[key]=value;
 if(rerender&&(['session.role','pipelineTemplate','lineageDoc'].includes(name)||['dsConfig.domain','dsConfig.source','dsConfig.year','struct.document','struct.domain','struct.quality','struct.format','assetFilters.category','assetFilters.format','assetFilters.domain','assetFilters.license','assetFilters.status','assetFilters.batch','assetFilters.year','assetFilters.origin','assetFilters.language','assetFilters.sort'].includes(name))){if(name.startsWith('assetFilters.'))C.assetFilters.page=1;v3Render()}
}
const loginClickHandler=e=>{if(e.target.id!=='login-button')return;let user=$('login-user').value.trim(),role=$('login-role').value;if(!user){notify('请输入演示用户名',true);return}CF.session.loggedIn=true;CF.session.name=user.slice(0,60);CF.session.role=role;audit('演示登录','SESSION');notify('已进入本地演示工作空间（无真实身份认证）');v3Render()};
document.addEventListener('click',loginClickHandler,true);
// Fixed baseline lineage and read-only source graph; runtime additions must use stable IDs.
DB.lineageEdges=DB.segments.map(s=>({from:s.document_version_id,to:s.segment_id,relation:'contains'}));
DB.datasetVersions[0].samples.forEach(s=>{DB.lineageEdges.push({from:s.segment_id,to:s.id,relation:'evidence'});DB.lineageEdges.push({from:s.id,to:'DS-V3-BASE',relation:'included_in'})});
v3Render();
