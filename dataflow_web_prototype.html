tate.stage===4?' 这份标准文件还在复核中，所以不应发布为训练集。':''}</div><div class="path" style="margin-top:14px"><b>${d.id}</b><span class="separator">→</span>PARSED-${d.id}<span class="separator">→</span>STRUCT-${d.id}<span class="separator">→</span>SEG-${d.id}<span class="separator">→</span>DATASET SAMPLE</div><div class="foot-note">真实追踪必须关联文件哈希、页码、处理算子版本、run_id、质量判定、父子样本关系。当前路径和内容均为虚构演示。</div></section>`}
function datasets(){const d=datasetData[state.product];return `${heading('训练数据产品中心','预训练语料、SFT、DPO、独立评测题和 RAG 索引片段采用不同格式与质量规则。',btn('查看来源证据','goto:trace','primary'))}${notice()}<section class="card card-pad"><div class="tabs">${Object.entries(datasetData).map(([k,v])=>`<button class="tab ${state.product===k?'active':''}" data-product="${k}">${v.name}</button>`).join('')}</div><div class="dataset-summary"><div class="hstack" style="justify-content:space-between"><strong style="font-size:18px">${d.name}</strong>${badge('预置数据样例','blue')}</div><div style="font-size:12px;color:#7e8c9f;margin-top:6px">${d.detail}</div></div><div class="grid cols-even"><div><div class="card-h">JSONL 样本格式 <small>${d.src}</small></div><div class="codebox" id="datasetCode">${escapeHtml(d.code)}</div><div class="hstack" style="margin-top:13px">${btn('复制示例 JSON','copy:dataset')}${btn('打开原始证据','goto:trace')}</div></div><div><div class="card-h">数据集发布与审核信息</div><div class="kv"><span>数据产品</span><b>${d.name}</b><span>数据规模</span><b>${d.size}</b><span>数据划分</span><b>${d.split}</b><span>来源依赖</span><b>${d.src}</b><span>状态</span>${badge('仅原型展示','amber')}</div><div class="mini-callout"><b>工程注意：</b>SFT、DPO、评测题必须独立复核和进行泄漏检查。不能把同一原始来源的相似问题同时放入训练集与独立评测集。</div></div></div></section>`}
function quality(){return `${heading('数据质量与发布版本','把去重、过滤、人工审核、错误处理与数据集发布记录放在一起。')}${notice()}<div class="grid kpis">${kpi('文档解析成功率','97.4%','演示数值','✓','green')}${kpi('重复文档比率','8.1%','精确 / 近似判定示例','≋')}${kpi('待人工复核','218','模拟异常队列','!','orange')}${kpi('样本溯源覆盖','99.2%','示例指标，未核验','◎','purple')}</div><div class="grid cols-2"><section class="card card-pad"><div class="card-h">处理漏斗 <small>各环节模拟文档数量</small></div>${[['原始登记',12480],['解析成功',12156],['结构化成功',11764],['去重及质量通过',10610]].map((x,i)=>`<div class="quality-row"><span>${x[0]}</span><div class="track"><div class="fill ${i===3?'teal':''}" style="width:${x[1]/12480*100}%"></div></div><b>${x[1].toLocaleString()}</b></div>`).join('')}<div class="foot-note">请注意文档数、Chunk 数和 Token 数应分开统计；跨集合去重必须执行。</div></section><section class="card card-pad"><div class="card-h">发布版本差异 <small>与处理阶段 L0–L4 不同</small></div><div class="hstack" style="margin-bottom:16px">${['v1','v2','v3'].map(v=>`<button class="chip ${state.release===v?'active':''}" data-release="${v}">Release ${v.toUpperCase()}</button>`).join('')}</div><div class="grid cols-even" style="gap:8px"><div class="metric-tile"><strong>${{v1:'9,430',v2:'10,610',v3:'规划中'}[state.release]}</strong><span>有效文档（模拟）</span></div><div class="metric-tile"><strong>${{v1:'67,800',v2:'86,430',v3:'—'}[state.release]}</strong><span>片段数（模拟）</span></div></div><div class="summaryline">${{v1:'V1：初版快照，使用基础解析与清洗配置。',v2:'V2：加入改进版质量规则、去重与来源追溯。',v3:'V3：后续计划加强人工复核和多模态处理，尚未发布。'}[state.release]}</div></section></div><section class="card card-pad"><div class="card-h">质量问题与复核队列 <small>三种适合现场展示的样本</small></div><div class="table-wrap"><table class="tbl"><thead><tr><th>问题 ID</th><th>关联文档</th><th>处理阶段</th><th>触发原因</th><th>状态</th></tr></thead><tbody><tr><td>ISSUE-001</td><td>标准规范 PDF</td><td>L2 结构化</td><td>表格字段缺失</td><td>${badge('人工复核','amber')}</td></tr><tr><td>ISSUE-002</td><td>论文转载副本</td><td>L3 去重</td><td>内容哈希 / 高相似匹配</td><td>${badge('已隔离','red')}</td></tr><tr><td>ISSUE-003</td><td>网页新闻模板</td><td>L3 清洗</td><td>导航与页脚噪声</td><td>${badge('已清洗')}</td></tr></tbody></table></div></section>`}
function rag(){return `${heading('RAG 与下游效果验证','RAG 是清洗后数据的应用场景；模型训练 / 评测则消费独立的数据集产品。',btn('查看 RAG 样本结构','product:rag'))}${notice()}<section class="card card-pad" style="margin-bottom:16px"><div class="card-h">知识检索与生成链路 <small>下游验证流程</small></div><div class="ragflow">${['合格片段','Chunk + Embedding','混合检索','Rerank','证据上下文','LLM 回答'].map((s,i)=>`${i?'<span style="color:#9daec1">→</span>':''}<span class="ragbox">${s}</span>`).join('')}</div><div class="foot-note">真实系统需支持向量索引、权限过滤、引用来源、检索召回率和答案忠实度评测。</div></section><div class="grid cols-2"><section class="card card-pad"><div class="card-h">知识库问答 · 静态回放</div><label style="font-size:12px;font-weight:750;display:block;margin-bottom:8px">演示问题</label><div class="input" style="background:#f8fafd;width:100%;margin-bottom:13px">安全多方计算解决什么问题？</div>${btn(state.ragDone?'已显示预置结果':'查看预置回答与来源','rag:show','primary')}${state.ragDone?`<div class="raganswer" style="margin-top:17px"><b>预置参考回答</b><p>安全多方计算使多个参与方能够协同计算，同时避免直接披露各自的私有输入。此处仅演示带来源的回答展示方式。</p><div style="font-size:11px;color:#208873;cursor:pointer" data-act="goto:trace">📎 来源：SRC-0001 · 第 2 页 · SEG-0001-01 → 查看原文</div></div>`:''}<div class="foot-note">该交互不调用真实检索器或大模型，展示的是事先准备的样例回答。</div></section><section class="card card-pad"><div class="card-h">下游评测应该记录什么？</div><div class="bars">${[['RAG 召回','Recall@K、来源一致性'],['回答事实性','是否得到原始证据支持'],['训练前后效果','固定评测集和对照实验'],['回流改进','错误样本 → 原始文档 → 修复/复测']].map((x,i)=>`<div style="padding:9px 0;border-bottom:1px solid #edf1f5;display:flex;gap:11px"><span class="stepsmall">0${i+1}</span><div><strong style="font-size:12px">${x[0]}</strong><div style="font-size:11px;color:#8a9aaa">${x[1]}</div></div></div>`).join('')}</div></section></div>`}
function render(){drawNav();const map={overview,assets,pipeline,trace,datasets,quality,rag};document.getElementById('content').innerHTML=map[state.page]();document.getElementById('breadcrumb').textContent=navGroups.flatMap(x=>x.items).find(x=>x[0]===state.page)?.[1]||'总览';document.getElementById('sidebar').classList.remove('mobile-open');if(state.page==='assets'){document.getElementById('assetQuery').addEventListener('input',e=>{state.assetQuery=e.target.value;const cursor=e.target.selectionStart;render();const f=document.getElementById('assetQuery');f.focus();f.setSelectionRange(cursor,cursor)})}}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-page],[data-act],[data-doc],[data-doc-select],[data-stage],[data-filter],[data-product],[data-release]');if(!btn)return;if(btn.dataset.page){go(btn.dataset.page);return}if(btn.dataset.doc!==undefined){state.doc=Number(btn.dataset.doc);state.stage=0;go('trace');return}if(btn.dataset.docSelect!==undefined){state.doc=Number(btn.dataset.docSelect);state.stage=0;render();return}if(btn.dataset.stage!==undefined){state.stage=Number(btn.dataset.stage);render();return}if(btn.dataset.filter){state.assetType=btn.dataset.filter;render();return}if(btn.dataset.product){state.product=btn.dataset.product;render();return}if(btn.dataset.release){state.release=btn.dataset.release;render();return}const act=btn.dataset.act;if(!act)return;const [type,payload]=act.split(':');if(type==='goto')go(payload);if(type==='product'){state.product=payload;go('datasets')}if(type==='rag'){state.ragDone=true;render()}if(type==='copy'){const val=payload==='trace'?[docs[state.doc].before,docs[state.doc].md,docs[state.doc].json,docs[state.doc].clean,docs[state.doc].product][state.stage]:datasetData[state.product].code;navigator.clipboard?.writeText(val).then(()=>{const old=btn.textContent;btn.textContent='已复制 ✓';setTimeout(()=>btn.textContent=old,1400)}).catch(()=>alert('当前浏览器限制剪贴板权限'))}});
render();
</script>
